<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>


    <style>
        :root{
            --main-color:blue;
             --main-color1:rgb(255, 0, 0);
            --padding-size:20px;
        }
        .div1 {
            height: 100px;
            width: 100px;
            display: block;
            border: 2px solid;
            background-color: var(--main-color);
            float: left;
            padding:var(--padding-size)

        }
        .div2{
            border:5px solid;
            background-color: var(--main-color1);
        }
        .div3{
            background-color: var(--main-color);
            float:left;

        }
        .div4{
            padding: var(--padding-size);
            background-color: var(--main-color1);
            clear: left;
        }
    </style>
</head>


<body>


    <h2>Without Clear</h2>
    <div class="div1">div1</div>
    <div class="div2">
        <p>Lorem ipsum dolor sit.</p>
        <p>Lorem, ipsum dolor.</p>
        <p>Lorem ipsum dolor sit, amet consectetur adipisicing elit. Ullam, tempore?</p>
    </div>
    <br><br><br>
    <h2>With Clear</h2>
    <div class="div3">div3</div>
    <div class="div4">
        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Praesentium, eligendi.</p>
    </div>


</body>

</html>
