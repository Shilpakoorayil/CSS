<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        li{
            font-size: 18px;
        }
        /* here we can select the items to color */
        li:nth-child(even){
            color: red;
            font-weight: bold;
        }
    </style>

</head>
<body>
    <ul>
        <li>Item 1</li>
         <li>Item 2 </li>
          <li>Item 3</li>
            <li>Item 4</li>
           <li>Item 5</li>
            <li>Item 6</li>
             <li>Item 7</li>


    </ul>
</body>
</html>
